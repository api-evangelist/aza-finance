          description: City of birth of sender
          example: London
        country_of_birth:
          type: string
          description: Country of birth of sender in 2-character alpha ISO 3166-2 country format
          example: GB
        gender:
          type: string
          description: 'The gender of the sender:


            - `M`: Male

            - `F`: Female

            - `O`: Other'
          example: M
