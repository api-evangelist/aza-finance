          type: number
          description: The amount that had to be paid in for this payment to proceed
          readOnly: true
          example: 10
        input_currency:
          type: string
          description: The currency this payment was paid in
          readOnly: true
          example: USD
        output_amount:
          type: number
          description: The amount that will be paid to the recipient
          readOnly: true
          example: 10000
        output_currency:
          type: string
          description: The currency the payment will be delivered in
          readOnly: true
          example: NGN
        id:
          type: string
          format: uuid
          readOnly: true
          example: 97e79719-06e4-4794-aeeb-d2d9415d983a
        type:
          type: string
          description: 'Type of recipient to create - either person or business (defaults to person)

