    PayoutMethodTransferReasonEnum:
      type: string
      description: "Reason of transfer\n\nAvailable values:\n  - `personal_account`: Sending money into my own account\n  - `donations_and_gifts`: Donations and gifts\n  - `third_party_person_account`: Sending money to a friend, family member or any third party person\n  - `mortgage_repayments`: Mortgage repayments\n  - `business_travel_payments`: Business Travel Payments\n  - `personal_travel_payments`: Personal Travel Payments\n  - `tuition_fees`: Tuition fees\n  - `financial_commission_fees`: Commission and fees for financial services\n  - `financial_services_proceeds`: Proceeds for financial services charged for advice provided\n  - `individual_property_investments`: Investment into property by a foreign individual\n  - `other_investments`: Investment by a foreign individual - other\n  - `corporate_property_investments`: Investment into property by a foreign corporate entity\n  - `immigrants_capital_payments`: Capital payments by immigrants\n  - `legal_services`: Legal services\n  - `accounting_services`: Accounting services\n  - `consulting_services`: Management consulting services\n  - `public_relation_services`: Public relation services\n  - `ads_and_market_research_services`: Advertising & market research services\n  - `managerial_services`: Managerial services\n  - `medical_and_dental_services`: Medical and dental services\n  - `educational_services`: Educational services\n  - `operational_leasing`: Operational leasing\n  - `cultural_and_recreational_services`: Cultural and recreational services\n  - `salary_resident_out_country`: Salary paid to South African Resident Temporarily Abroad\n  - `salary_non_resident_in_country`: Salary paid to a non-resident employee in South Africa\n  - `salary_contract_worker_in_country`: Salary paid to a foreign national contract worker in South Africa\n  - `social_security_schemes`: Payments to social security schemes\n  - `charities_and_religious_bodies`: Payments to charities and religious bodies\n  - `donations_and_aid_to_government`: Donations and aid to Government\n  - `donations_and_aid_to_private`: Donations and aid to private sector\n  - `pensions`: Pensions\n  - `annuities`: Annuities\n  - `inheritances`: Inheritances\n  - `alimony`: Alimony\n  - `tax_income`: Tax - Income tax\n  - `tax_vat_refunds`: Tax - VAT refunds\n  - `tax_other`: Tax - Other\n  - `non_life_insurance_premiums`: Insurance premiums (non life/short term)\n  - `life_insurance_premiums`: Insurance premiums (life)\n  - `dividends`: Dividends\n  - `branch_profits`: Branch profits\n  - `commision_or_brokerage`: Commission or brokerage\n  - `rental`: Rental\n  - `individual_investment_income_from_abroad`: Income earned abroad by a resident on an individual investment\n  - `shares_sale`: Sale of shares\n  - `bonds_sale`: Sale of bonds\n  - `money_market_instruments_sale`: Sale of money market instruments\n  - `funds_repatriation_of_foreign_bank_account`: Repatriation of funds out of a foreign bank account\n  - `mutual_funds_sale_or_collective_investment`: Sale of mutual funds or collective investment schemes\n  - `overseas_property_sale`: Sale of overseas property\n  - `sale_and_repatriation_of_other_investment`: Sale and repatriation of other investment\n  - `repatriation_south_african_reserve_bank_instruction`: Repatriation on instruction by the South African Reserve Bank\n  - `resident_loan_from_non_resident_share_holder`: Loan made to a resident by a non-resident shareholder\n  - `resident_loan_from_non_resident_third_party`: Loan made to a resident by a non-resident third party\n  - `resident_loan_repayment_from_overseas_living_south_african`: Repayment by a South African living overseas of a loan granted by a resident\n  - `study_loan_repayment`: Repayment of a study loan\n  - `shareholders_loan_repayment`: Repayment of a shareholders loan\n  - `third_party_loan_repayment`: Repayment of a third party loan (excluding shareholders)\n  - `trade_finance_loan_repayment`: Repayment of a trade finance loan\n  - `research_and_development_proceeds`: Proceeds received for research and development services\n  - `research_and_development_funding`: Funding received for research and development\n  - `machinary_and_equipment_repairs`: Repairs and maintenance on machinery and equipment\n  - `architectural_engineering_technical_services`: Architectural, engineering and other technical services\n  - `agrigultural_mining_waste_depollution_services`: Agricultural, mining, waste treatment and depollution services\n  - `construction_services`: Proceeds for construction services\n  - `telecommunication_services`: Payments for telecommunication services\n  - `data_news_agency_fees`: Payments for data, news related and news agency fees\n  - `road_passenger_services`: Payments for passenger services - road\n  - `rail_passenger_services`: Payments for passenger services - rail\n  - `sea_passenger_services`: Payments for passenger services - sea\n  - `air_passenger_services`: Payments for passenger services - air\n  - `road_freight_services`: Payments for freight services - road\n  - `rail_freight_services`: Payments for freight services - rail\n  - `sea_freight_services`: Payments for freight services - sea\n  - `air_freight_services`: Payments for freight services - air\n  - `road_postal_and_courier_services`: Payments for postal and courier services - road\n  - `rail_postal_and_courier_services`: Payments for postal and courier services - rail\n  - `sea_postal_and_courier_services`: Payments for postal and courier services - sea\n  - `air_postal_and_courier_services`: Payments for postal and courier services - air\n  - `listed_shares_investment`: Investment in listed shares\n  - `non_listed_shares_investment`: Investment in non-listed shares\n  - `money_market_instruments_investment`: Investment into money market instruments\n  - `listed_bonds_investment`: Investment into listed bonds\n  - `non_listed_bonds_investment`: Investment into non-listed bonds\n  - `reproduce_distribute_rights_license`: Rights assigned for licences to reproduce and/or distribute\n  - `patents_and_investions_rights_license`: Rights assigned for using patents and inventions (licensing)\n  - `patterns_and_designs_rights`: Rights assigned for using patterns and designs (including industrial processes)\n  - `copyrights_rights`: Rights assigned for using copyrights\n  - `franchises_and_trademarks_rights`: Rights assigned for using franchises and trademarks\n  - `patents_and_inventions_disposal`: Disposal of patents and inventions\n  - `patterns_and_designs_disposal`: Disposal of patterns and designs (including industrial processes)\n  - `copyrights_disposal`: Disposal of copyrights\n  - `franchises_and_trademarks_disposal`: Disposal of franchises and trademarks\n  - `sales_of_manuscripts_sound_recordings_films`: Sales of original manuscripts, sound recordings and films\n  - `funds_related_to_recording_productions`: Receipt of funds relating to the production of motion pictures, radio and television programs and musical recordings\n  - `software_ownership_rights_sale`: The outright selling of ownership rights of software\n  - `computer_services`: Computer-related services including maintenance, repair and consultancy\n  - `customised_software_sales`: Commercial sales of customised software and related licenses for use of customers\n  - `non_customised_software_on_physical_media_periodic_licence_sale`: Commercial sales of non-customised software on physical media with periodic licence to use\n  - `non_customised_software_on_pyisical_media_perpetual_use_sale`: Commercial sales of non-customised software provided on physical media with right to perpetual (ongoing) use\n  - `non_customised_software_for_downloading_electronically_made_periodic_licence_sale`: Commercial sales of non-customised software provided for downloading or electronically made available with periodic license\n  - `non_customised_software_for_downloading_electronically_made_single_payment_sale`: Commercial sales of non-customised software provided for downloading or electronically made available with single payment\n  - `fixed_assets_donations_to_sa_government`: Donations to SA Government for fixed assets\n  - `fixed_assets_donations_to_corporate_entities`: Donations to corporate entities - fixed assets\n  - `property_disinvestment_by_corporate_entity_resident`: Disinvestment of property by a resident corporate entity\n  - `other_business_services`: Proceeds for other business services not included elsewhere\n  - `institutional_investor_disinvestment`: Disinvestment by resident institutional investor - Collective Investment Scheme\n  - `government_services`: Payment for Government Services\n\n### ZAR Bidvest mandate-bypass-eligible keys\n\nThe following short-form values opt a ZAR Bidvest payout into the SARB FinSurv §B.1 mandate-bypass flow (no signed mandate required) when ALL of these conditions hold:\n\n  - the payout is on the ZAR Bidvest corridor (not `access_bank`),\n  - the recipient is a natural person (`first_name` populated),\n  - the requested currency is ZAR,\n  - the output amount is ≤ R50,000.\n\nIf any condition is not met, the transaction falls back to the standard mandate-signing flow. Sending any of these keys is therefore safe even when bypass is not active — the value is recorded against the transfer regardless.\n\n  - `own_account`: Sending money into my own account\n  - `donations_gifts`: Donations and gifts\n  - `family_support`: Sending money to a friend, family member or any third party person\n  - `mortgage_repayment`: Mortgage repayments\n  - `business_travel`: Business Travel Payments\n  - `personal_travel`: Personal Travel Payments\n  - `tuition_fees`: Tuition fees (also a general-purpose key)\n  - `legal_services`: Legal services (also a general-purpose key)\n  - `accounting_services`: Accounting services (also a general-purpose key)\n  - `management_consulting`: Management consulting services\n  - `advertising_market_research`: Advertising and market research services\n  - `cultural_recreational`: Cultural and recreational services\n  - `salary_resident_abroad`: Salary — SA resident temporarily abroad\n  - `salary_non_resident_in_sa`: Salary — non-resident employee in SA\n  - `salary_foreign_contract_in_sa`: Salary — foreign contract worker in SA\n  - `pensions`: Pensions (also a general-purpose key)\n  - `annuities`: Annuities (also a general-purpose key)\n  - `inheritances`: Inheritances (also a general-purpose key)\n  - `alimony`: Alimony (also a general-purpose key)\n  - `dividends`: Dividends (also a general-purpose key)\n  - `commission_brokerage`: Commission or brokerage\n  - `rental`: Rental (also a general-purpose key)\n  - `investment_income`: Income earned abroad on individual investment\n  - `architectural_engineering`: Architectural / engineering / technical services\n  - `computer_services`: Computer-related services (also a general-purpose key)"
