    PayinMethodDetails:
      description: 'Fields needed by the payment processor. Depends on the chose payin type.


        See the appropriate model details for more info:


        - `NGN::Bank`: see [`PayinMethodDetailsNGNBank`](#model-PayinMethodDetailsNGNBank)

        - `GHS::Mobile`: see [`PayinMethodDetailsMobile`](#model-PayinMethodDetailsMobile)

        - `UGX::Mobile`: see [`PayinMethodDetailsMobile`](#model-PayinMethodDetailsMobile)


        Note that some payin processors don''t require additional input, these include `lhv` through `EUR::Bank` and `GBP::Bank`.

        Some providers like `providus` also have all of their fields set as optional, so you might not want to set any values.

        To use these providers please set this value to `{}` (an empty hash)

        '
      oneOf:
      - $ref: '#/components/schemas/PayinMethodDetailsNGNBank'
      - $ref: '#/components/schemas/PayinMethodDetailsMobile'
      - $ref: '#/components/schemas/PayinMethodDetailsBTC'
    WebhookDefinition:
      required:
      - events
      - url
      type: object
      properties:
        url:
          type: string
          description: The URL to receive the webhook
          example: http://webhook.site/webhooks
        events:
          type: array
          description: A list of events to subscribe to
          items:
            type: string
            example: transaction.paid_in
        metadata:
          type: object
          example: {}
        id:
          type: string
          description: The ID of the webhook
          readOnly: true
          example: 1cd580b2-2a1b-4f73-81c8-0308308baef2
        errors:
          additionalProperties:
            type: array
            readOnly: true
            items:
              $ref: '#/components/schemas/ValidationErrorDescription'
          description: The fields that have some problems and don't pass validation
          readOnly: true
          example:
            phone_number:
            - error: invalid
            documents:
            - error: blank
      description: Object that holds where to send webhooks, and what events should it be triggered with
      example:
        metadata: {}
        id: 1cd580b2-2a1b-4f73-81c8-0308308baef2
        url: http://webhook.site/webhooks
        events:
        - transaction.paid_in
        - transaction.paid_in
        errors:
          phone_number:
          - error: invalid
          documents:
          - error: blank
      externalDocs:
        description: Webhooks in the API guide
        url: https://docs.transferzero.com/docs/architecture/#webhooks
    FieldDescription:
      type: object
      properties:
        type:
          type: string
          description: the type of the field.
          readOnly: true
          example: input
          enum:
          - input
          - select
        validations:
          $ref: '#/components/schemas/FieldValidation'
    Sender:
      required:
      - city
      - country
      - documents
      - email
      - ip
      - postal_code
      - street
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: bf9ff782-e182-45ac-abea-5bce83ad6670
        type:
          type: string
          description: 'Type of sender to create - either person or business (defaults to person)

            '
          example: person
          enum:
          - person
          - business
        state:
          $ref: '#/components/schemas/SenderState'
        country:
          type: string
          description: Country of sender in 2-character alpha ISO 3166-2 country format. This is the residential country for personal senders and the country of incorporation for business senders.
          example: NG
        street:
          type: string
          description: Sender's street
          example: Fake Street
        postal_code:
          type: string
          description: Zip code of sender
          example: '798983'
        city:
          type: string
          description: Sender's city
          example: Kampala
        phone_country:
          type: string
          description: Phone country of sender in 2-character alpha ISO 3166-2 country format
          example: NG
        phone_number:
          type: string
          description: Phone number of sender (without country callcode)
          example: '752403639'
        email:
          type: string
          description: Email of sender
          format: email
          example: example@home.org
        ip:
          type: string
          description: IP of sender
          format: ipv4
          example: 127.0.0.1
        fingerprint:
          type: string
          description: Fingerprint of sender
          example: fingerprint
        address_description:
          type: string
          description: Description of address
        identification_number:
          type: string
          description: Identification number of document used
          example: AB123456
        identification_type:
          type: string
          description: 'Document to be identified. The identification type can be one of the following:


            - `DL`: Driving License

            - `PP`: International Passport

            - `ID`: National ID

            - `OT`: Other


            Please note for Wizall `XOF::Cash` transactions the valid options are:

            - `ID`: National ID

            - `PP`: Passport'
          example: ID
          enum:
          - DL
          - PP
          - ID
          - OT
        lang:
          type: string
          description: Determines language of the served content. Defaults to English
          example: en
        name:
          type: string
          description: Name of sender (used only with a Business sender)
        first_name:
          type: string
          description: First name of sender (used only with a Personal sender)
          example: Johnny
        middle_name:
          type: string
          description: Middle name of sender (used only with a Personal sender)
          example: Johnny
        last_name:
          type: string
          description: Last name of sender (used only with a Personal sender)
          example: English
        birth_date:
          type: string
          description: Date of birth of sender (used only with a Personal sender)
          format: date
