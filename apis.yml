aid: aza-finance
name: AZA Finance
description: >-
  AZA Finance is a regulated financial-infrastructure provider delivering foreign
  exchange (FX), collections, treasury and cross-border payout services across Africa
  and between Africa and the rest of the world. Its developer platform is the
  TransferZero API V1 — a REST API that lets businesses create senders, quote FX,
  send bulk and individual payouts to bank accounts and mobile-money wallets, validate
  accounts, attach KYC documents, and receive real-time webhook notifications.
  Authentication is HMAC request-signing; official SDKs are published for Ruby,
  JavaScript, PHP, .NET and Java. AZA Finance is licensed by the UK FCA (#673100),
  the Bank of Uganda (#MR 125/23) and the Central Bank of Nigeria.
